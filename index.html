<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#17151f" />
  <title>Velvet — Calculator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="calculator" aria-label="Calculator">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>velvet</span></div>
      <span class="mode">CALCULATOR <span class="live-dot"></span></span>
    </header>

    <section class="display" aria-live="polite" aria-atomic="true">
      <div id="expression" class="expression">&nbsp;</div>
      <div id="result" class="result">0</div>
      <div id="status" class="status">Ready when you are</div>
    </section>

    <section class="keypad" aria-label="Calculator keys">
      <button class="key utility" data-action="clear">AC</button>
      <button class="key utility" data-action="sign" aria-label="Change sign">+/−</button>
      <button class="key utility" data-action="percent">%</button>
      <button class="key operator" data-value="÷" aria-label="Divide">÷</button>

      <button class="key" data-value="7">7</button>
      <button class="key" data-value="8">8</button>
      <button class="key" data-value="9">9</button>
      <button class="key operator" data-value="×" aria-label="Multiply">×</button>

      <button class="key" data-value="4">4</button>
      <button class="key" data-value="5">5</button>
      <button class="key" data-value="6">6</button>
      <button class="key operator" data-value="−" aria-label="Subtract">−</button>

      <button class="key" data-value="1">1</button>
      <button class="key" data-value="2">2</button>
      <button class="key" data-value="3">3</button>
      <button class="key operator" data-value="+" aria-label="Add">+</button>

      <button class="key utility" data-action="backspace" aria-label="Delete last digit">⌫</button>
      <button class="key" data-value="0">0</button>
      <button class="key" data-value=".">.</button>
      <button class="key equals" data-action="equals" aria-label="Equals">=</button>
    </section>
    <footer><span>MADE WITH CURIOSITY</span><span>✧ &nbsp; KEEP EXPLORING</span></footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
